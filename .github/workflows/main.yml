name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
env:
  AZURE_WEBAPP_NAME: job-market-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Restore package
        run: dotnet restore ./src/JobMarketplace.Api/JobMarketplace.Api.csproj

      - name: Build package
        run: dotnet build ./src/JobMarketplace.Api/JobMarketplace.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/JobMarketplace.Api/JobMarketplace.Api.csproj --configuration Release --no-build --property:PublishDir='${{ env.DOTNET_ROOT }}/publish'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: "${{ env.DOTNET_ROOT }}/publish"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: .net-app

      - name: Deploy
        uses: Azure/webapps-deploy@v2.2.19
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: "${{ env.DOTNET_ROOT }}/publish"
