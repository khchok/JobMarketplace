name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: job-market-service
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Restore
        run: dotnet restore ./src/JobMarketplace.Api/JobMarketplace.Api.csproj

      - name: Build
        run: dotnet build ./src/JobMarketplace.Api/JobMarketplace.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/JobMarketplace.Api/JobMarketplace.Api.csproj --configuration Release --no-build --property:PublishDir=${{ env.PUBLISH_DIR }}

      - name: Verify publish output
        run: |
          echo "=== Published files ==="
          ls -la ${{ env.PUBLISH_DIR }}
          echo "=== Entry point ==="
          ls ${{ env.PUBLISH_DIR }}/JobMarketplace.Api* || echo "WARNING: entry point binary not found"

      - name: Deploy
        uses: Azure/webapps-deploy@v2.2.19
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
